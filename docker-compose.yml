version: "3.9"

# ─────────────────────────────────────────────────────────────────
# Aetheris IAM — Phase 1 (OIDC Federation) + Phase 2 (IAP + OPA)
# Usage: docker compose up --build
# ─────────────────────────────────────────────────────────────────

networks:
  aetheris-net:
    driver: bridge

volumes:
  keycloak-data:
  opa-data:
  postgres-data:

services:

  postgres:
    image: postgres:15-alpine
    container_name: aetheris-postgres
    environment:
      POSTGRES_DB: aetheris
      POSTGRES_USER: aetheris_admin
      POSTGRES_PASSWORD: aetheris_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aetheris-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetheris_admin -d aetheris"]
      interval: 5s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: aetheris-control-plane
    environment:
      PORT: "8183"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "aetheris_admin"
      DB_PASSWORD: "aetheris_password"
      DB_NAME: "aetheris"
    expose:
      - "8183"
    ports:
      - "8183:8183"
    volumes:
      - ./policies:/policies:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aetheris-net
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:8183/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Phase 1: Identity Provider ────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: aetheris-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/aetheris
      KC_DB_USERNAME: aetheris_admin
      KC_DB_PASSWORD: aetheris_password
      KC_DB_SCHEMA: public
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8080:8080"
    networks:
      - aetheris-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/aetheris/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Phase 2: Policy Engine ────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.65.0-debug
    container_name: aetheris-opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - --log-level=info
      - --config-file=/policies/opa-config.yaml
      - /policies/authz.rego
    volumes:
      - ./policies:/policies:ro
    ports:
      - "8181:8181"
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - aetheris-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Phase 2: Identity-Aware Proxy ─────────────────────────────
  oathkeeper:
    image: oryd/oathkeeper:v0.40.7
    container_name: aetheris-oathkeeper
    command: serve --config /etc/config/oathkeeper/config.yml
    volumes:
      - ./oathkeeper/config/config.yml:/etc/config/oathkeeper/config.yml:ro
      - ./oathkeeper/rules/rules.json:/etc/config/oathkeeper/rules/rules.json:ro
    ports:
      - "4455:4455"   # proxy (public entry point)
      - "4456:4456"   # management API
    networks:
      - aetheris-net
    depends_on:
      keycloak:
        condition: service_healthy
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4456/health/alive || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Protected Resources ───────────────────────────────────────
  microservice-a:
    build:
      context: ./k8s/microservices
      dockerfile: Dockerfile
      args:
        SERVICE_FILE: service_a.py
        SERVICE_PORT: 5000
    container_name: aetheris-svc-a
    environment:
      PORT: "5000"
    expose:
      - "5000"
    networks:
      - aetheris-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  microservice-b:
    build:
      context: ./k8s/microservices
      dockerfile: Dockerfile
      args:
        SERVICE_FILE: service_b.py
        SERVICE_PORT: 5001
    container_name: aetheris-svc-b
    environment:
      PORT: "5001"
    expose:
      - "5001"
    networks:
      - aetheris-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  cara-mock:
    build:
      context: ./k8s/microservices
      dockerfile: Dockerfile
      args:
        SERVICE_FILE: cara_mock.py
        SERVICE_PORT: 5002
    container_name: aetheris-cara-mock
    environment:
      PORT: "5002"
      MOCKDATA_PATH: "/mockdata"
    volumes:
      - ./mockdata:/mockdata:ro
    expose:
      - "5002"
    ports:
      - "5002:5002"
    networks:
      - aetheris-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: aetheris-redis
    ports:
      - "6379:6379"
    networks:
      - aetheris-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  opa-adapter:
    build:
      context: ./k8s/microservices
      dockerfile: Dockerfile
      args:
        SERVICE_FILE: opa_adapter.py
        SERVICE_PORT: 8182
    container_name: aetheris-opa-adapter
    environment:
      PORT: "8182"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    expose:
      - "8182"
    ports:
      - "8182:8182"
    depends_on:
      opa:
        condition: service_healthy
      cara-mock:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aetheris-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8182/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: aetheris-dashboard
    environment:
      - HOSTNAME=0.0.0.0
      - KEYCLOAK_URL=http://keycloak:8080
      - CARA_URL=http://cara-mock:5002
      - OPA_ADAPTER_URL=http://opa-adapter:8182
      - REDIS_HOST=redis
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app/dashboard
      - ./scripts:/app/scripts:ro
      - ./mockdata:/app/mockdata
      - ./policies:/app/policies
    depends_on:
      keycloak:
        condition: service_healthy
      cara-mock:
        condition: service_healthy
      opa-adapter:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aetheris-net
