apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-a
  namespace: aetheris
  labels:
    app: microservice-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservice-a
  template:
    metadata:
      labels:
        app: microservice-a
    spec:
      containers:
      - name: microservice-a
        image: aetheris-svc-a:local
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: microservice-a
  namespace: aetheris
spec:
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  selector:
    app: microservice-a
---
